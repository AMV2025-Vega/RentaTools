# API Gateway / Reverse proxy: ÚNICA puerta de entrada al sistema (puerto 80).
# Ningún otro contenedor publica puertos hacia el host.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;                      # no revelar versión de Nginx
    client_max_body_size 1m;
    sendfile on;
    gzip on;
    gzip_types application/json text/css application/javascript;

    # Cada petición recibe un ID que viaja hasta Django (trazabilidad de auditoría).
    log_format gateway '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                       'rid=$request_id upstream=$upstream_addr rt=$request_time';
    access_log /dev/stdout gateway;
    error_log  /dev/stderr warn;

    # Limita ráfagas por IP en la API (protección básica contra abuso).
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

    upstream monolito_django { server django:8000; }
    upstream servicio_costo  { server costo:5000; }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;

        # Archivos estáticos (admin, CSS/JS): los sirve Nginx directamente.
        location /static/ {
            alias /srv/static/;
            expires 7d;
        }

        # --- Strangler Fig -------------------------------------------------
        # La ruta de costos ya NO la atiende el monolito sino el microservicio Flask.
        location /api/v2/reservas/costo/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://servicio_costo;
            include /etc/nginx/proxy_params.conf;
        }

        # Todo lo demás sigue en el monolito Django.
        location / {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://monolito_django;
            include /etc/nginx/proxy_params.conf;
        }
    }
}
