events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/json;

    upstream django_app {
        server django:8000;
    }

    upstream flask_app {
        server flask:5000;
    }

    server {
        listen 80;
        server_name localhost;

        # Enrutamiento al Monolito Django (v1)
        location /api/v1/ {
            proxy_pass http://django_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Strangler Fig: Enrutamiento al Microservicio Flask de Costos (v2)
        location /api/v2/reservas/costo/ {
            proxy_pass http://flask_app/api/v2/reservas/costo/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Raíz por defecto hacia Django
        location / {
            proxy_pass http://django_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}