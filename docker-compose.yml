# Orquestación de RentaTools: arquitectura de 3 capas aislada por redes Docker.
#
#   Internet --:80--> [nginx] --edge_net--> [django] --data_net(internal)--> [postgres]
#                                  \--edge_net--> [costo]
#
# * edge_net : capa de presentación/gateway (única con puerto publicado: nginx:80).
# * data_net : capa de datos. `internal: true` => sin salida a Internet ni acceso desde fuera.
name: rentatools

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"                      # ÚNICO puerto expuesto del sistema
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - static_data:/srv/static:ro
    depends_on:
      django:
        condition: service_healthy
      costo:
        condition: service_healthy
    networks: [edge_net]
    restart: unless-stopped

  django:
    build: ./monolith
    env_file: .env
    environment:
      POSTGRES_HOST: db
    volumes:
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    networks: [edge_net, data_net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/api/salud/"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  costo:
    build: ./services/costo
    networks: [edge_net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [data_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

networks:
  edge_net:
    driver: bridge
  data_net:
    driver: bridge
    internal: true

volumes:
  pg_data:
  static_data:
