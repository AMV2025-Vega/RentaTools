version: '3.8'

services:
  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rentatools-django
    ports:
      - "8000:8000"
    environment:
      - COSTO_SERVICE_URL=http://flask:5000/api/v2/reservas/costo/
    networks:
      - rentatools-network

  flask:
    build:
      context: ./rentatools-costo-service
      dockerfile: Dockerfile
    container_name: rentatools-flask
    ports:
      - "5000:5000"
    networks:
      - rentatools-network

  nginx:
    image: nginx:alpine
    container_name: rentatools-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - django
      - flask
    networks:
      - rentatools-network

networks:
  rentatools-network:
    driver: bridge