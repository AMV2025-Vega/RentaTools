# Orquestación de RentaTools: arquitectura de 3 capas aislada por redes Docker.
#
#   Internet --:80--> [nginx] --edge_net--> [django] --data_net(internal)--> [postgres]
#                                  \--edge_net--> [costo]      (microservicio propio)
#                                           [aliado]     (servicio del equipo aliado, simulado; solo interno)
#   [worker] (Celery) --data_net--> [redis] (broker) y [postgres]
#
# * edge_net : capa de presentación/gateway (única con puerto publicado: nginx:80).
# * data_net : capa de datos. `internal: true` => sin salida a Internet ni acceso desde fuera.
name: rentatools

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"                      # ÚNICO puerto expuesto del sistema
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - static_data:/srv/static:ro
    depends_on:
      django:
        condition: service_healthy
      costo:
        condition: service_healthy
    networks: [edge_net]
    restart: unless-stopped

  django:
    build: ./monolith
    env_file: .env
    environment:
      POSTGRES_HOST: db
    volumes:
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [edge_net, data_net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/api/salud/"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Worker de Celery: misma imagen que Django, procesos de fondo (notificaciones con reintentos, reportes).
  worker:
    build: ./monolith
    image: rentatools-django
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      django:
        condition: service_healthy        # el esquema de BD ya está migrado
      redis:
        condition: service_healthy
    networks: [edge_net, data_net]        # edge_net: salida a Internet (SMTP); data_net: BD y Redis
    restart: unless-stopped

  costo:
    build: ./services/costo
    networks: [edge_net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Servicio del ALIADO (seguros). No se publica ni pasa por Nginx: solo Django lo consume.
  aliado:
    build: ./services/aliado
    environment:
      ALIADO_API_KEY: ${ALIADO_API_KEY:-}
    networks: [edge_net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Message broker + backend de resultados. Solo en data_net (sin salida ni acceso desde fuera).
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]   # cola efímera: no hace falta persistir
    networks: [data_net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [data_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

networks:
  edge_net:
    driver: bridge
  data_net:
    driver: bridge
    internal: true

volumes:
  pg_data:
  static_data:
